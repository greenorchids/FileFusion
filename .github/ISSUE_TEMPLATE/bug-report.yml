name: Bug report
description: A conversion failed or the site misbehaved.
labels: ["bug"]
body:
  - type: input
    id: conversion
    attributes:
      label: Conversion
      placeholder: e.g. PNG to PDF
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include any error message shown. Please don't attach private files.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 131 on Windows 11, Safari on iPhone
